name: Build and Release llama-server Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
      backend:
        description: 'Backend to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cpu
          - metal
          - cuda
          - rocm

# note: run this workflow one at a time for better cache reuse
concurrency:
  group: release
  queue: max

jobs:
  build-matrix:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - CPU only (CUDA and ROCm are in separate jobs below)
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            backend: cpu

          # macOS aarch64 - Metal (combined with CPU)
          - os: macos-14  # M1 runner
            platform: macos
            arch: aarch64
            backend: metal

          # Windows x86_64 - CPU, CUDA (12 + 13)
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cpu
          # Windows-CUDA uses the vendored ./.github/actions/windows-setup-cuda
          # (pulled in via upstream merge) instead of Jimver/cuda-toolkit, because
          # Jimver doesn't fetch the cuda_crt redist package which is required by
          # CUDA 13+ (Jimver issue #437, still open). The action only supports
          # specific version pins — 12.4 and 13.3 here.
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cuda
            cuda_version: "12.4"
            version_suffix: "12.4"
          - os: windows-2022
            platform: windows
            arch: x86_64
            backend: cuda
            cuda_version: "13.3"
            version_suffix: "13.3"

    steps:
      # Check if this matrix entry should run based on filters
      - name: Check build filter
        id: filter
        shell: bash
        run: |
          PLATFORM_MATCH="false"
          BACKEND_MATCH="false"

          # Platform filter
          if [ "${{ inputs.platform }}" == "all" ] || [ "${{ inputs.platform }}" == "" ] || [ "${{ inputs.platform }}" == "${{ matrix.platform }}" ]; then
            PLATFORM_MATCH="true"
          fi

          # Backend filter
          if [ "${{ inputs.backend }}" == "all" ] || [ "${{ inputs.backend }}" == "" ] || [ "${{ inputs.backend }}" == "${{ matrix.backend }}" ]; then
            BACKEND_MATCH="true"
          fi

          if [ "$PLATFORM_MATCH" == "true" ] && [ "$BACKEND_MATCH" == "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Build will run: platform=${{ matrix.platform }}, backend=${{ matrix.backend }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping: platform=${{ matrix.platform }}, backend=${{ matrix.backend }} (filter: platform=${{ inputs.platform }}, backend=${{ inputs.backend }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      # ccache for faster rebuilds
      - name: ccache
        if: steps.filter.outputs.should_run == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}
          max-size: 500M
          update-package-index: true

      # Linux dependencies
      - name: Install Linux dependencies
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev

      # macOS dependencies
      - name: Install macOS dependencies
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'macOS'
        run: |
          brew install cmake

      # Windows dependencies (CMake is pre-installed)
      - name: Setup MSVC (Windows)
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows CUDA toolkit. Uses the vendored windows-setup-cuda action
      # (sourced from upstream ggml-org/llama.cpp), which fetches each redist
      # zip explicitly — critically including cuda_crt for the 13.x line,
      # which Jimver/cuda-toolkit doesn't (see issue #437).
      - name: Install CUDA toolkit (Windows)
        if: steps.filter.outputs.should_run == 'true' && runner.os == 'Windows' && matrix.backend == 'cuda'
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda_version }}

      # Build with CMake
      - name: Build llama-server
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir build
          cd build

          # Base CMake configuration with optimization flags
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DGGML_STATIC=OFF -DLLAMA_SERVER_ONLY=ON"

          # Portability and compatibility flags
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_NATIVE=OFF"              # Don't optimize for build machine CPU
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_BACKEND_DL=ON"           # Dynamic backend loading

          # Platform-specific RPATH for automatic library discovery
          if [ "${{ runner.os }}" == "Linux" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_INSTALL_RPATH='\$ORIGIN'"
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
            # Multi-CPU variant support for x86_64
            if [ "${{ matrix.arch }}" == "x86_64" ]; then
              CMAKE_ARGS="$CMAKE_ARGS -DGGML_CPU_ALL_VARIANTS=ON"
            fi
          elif [ "${{ runner.os }}" == "macOS" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_INSTALL_RPATH='@loader_path'"
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
            # Metal-specific optimizations
            if [ "${{ matrix.backend }}" == "metal" ]; then
              CMAKE_ARGS="$CMAKE_ARGS -DGGML_METAL_USE_BF16=ON"
              CMAKE_ARGS="$CMAKE_ARGS -DGGML_METAL_EMBED_LIBRARY=ON"
            fi
          elif [ "${{ runner.os }}" == "Windows" ]; then
            # Disable CURL on Windows (not easily available)
            CMAKE_ARGS="$CMAKE_ARGS -DLLAMA_CURL=OFF"

            # Windows + CUDA: cmake's default MSBuild generator can't find
            # the CUDA toolset because the vendored windows-setup-cuda action
            # doesn't copy CUDA's *.props/.targets files into VS's
            # BuildCustomizations\ (Jimver did, but Jimver can't install
            # cuda_crt for CUDA 13). Switch to Ninja Multi-Config which
            # drives nvcc directly — same trick upstream's
            # build-cuda-windows.yml uses. Ninja is pre-installed on the
            # windows-2022 runner image.
            if [ "${{ matrix.backend }}" == "cuda" ]; then
              export CMAKE_GENERATOR='Ninja Multi-Config'
            fi
          fi

          # Backend-specific configuration
          if [ "${{ matrix.backend }}" == "cuda" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=52;61;70;75;80;86;89;90"
          elif [ "${{ matrix.backend }}" == "rocm" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGGML_HIPBLAS=ON"
          elif [ "${{ matrix.backend }}" == "metal" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DGGML_METAL=ON"
          fi

          # Enable ccache for faster rebuilds
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake .. $CMAKE_ARGS
          cmake --build . --config Release --target llama-server -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

          echo "Build complete"
          ls -lah bin/ || ls -lah Release/ || ls -lah .

      # Find the built binary
      - name: Find binary path
        if: steps.filter.outputs.should_run == 'true'
        id: find_binary
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows: binary might be in build/bin/Release or build/Release
            BINARY_PATH=$(find build -name "llama-server.exe" -type f | head -n 1)
            BINARY_NAME="llama-server.exe"
          else
            # Unix: binary is in build/bin
            BINARY_PATH=$(find build/bin -name "llama-server" -type f 2>/dev/null | head -n 1)
            if [ -z "$BINARY_PATH" ]; then
              # Fallback: search entire build directory
              BINARY_PATH=$(find build -name "llama-server" -type f ! -name "*.d" | head -n 1)
            fi
            BINARY_NAME="llama-server"
          fi

          if [ -z "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found!"
            find build -type f -name "*llama-server*" || true
            exit 1
          fi

          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "binary_name=$BINARY_NAME" >> $GITHUB_OUTPUT
          echo "Found binary at: $BINARY_PATH"

      # Create release directory structure
      - name: Prepare release archive
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p release

          # Copy binary
          cp "${{ steps.find_binary.outputs.binary_path }}" "release/${{ steps.find_binary.outputs.binary_name }}"

          # For builds with dynamic backends: Copy shared libraries to same directory as binary
          # RPATH is set to $ORIGIN (Linux) or @loader_path (macOS), so libs must be alongside binary
          if [ -d "build/bin/Release" ]; then
            BUILD_LIB_DIR="build/bin/Release"
          else
            BUILD_LIB_DIR="build/bin"
          fi

          echo "Copying shared libraries from $BUILD_LIB_DIR"

          if [ "${{ runner.os }}" == "Windows" ]; then
            # Windows: Copy all DLLs
            find "$BUILD_LIB_DIR" -maxdepth 1 -name "*.dll" -exec cp {} release/ \;
            echo "Packaged DLLs:"
            ls -lh release/*.dll 2>/dev/null || echo "No DLLs found"

          elif [ "${{ runner.os }}" == "macOS" ]; then
            # macOS: Copy dylibs (resolved, not symlinks) and backend .so files
            for lib in libllama libggml libggml-base libmtmd; do
              if [ -f "$BUILD_LIB_DIR/${lib}.dylib" ]; then
                cp -H "$BUILD_LIB_DIR/${lib}.dylib" "release/"
              fi
            done

            # Copy backend plugins (.so files)
            find "$BUILD_LIB_DIR" -maxdepth 1 -name "*.so" -exec cp {} release/ \;

            # Copy Metal shader files for runtime compilation (only for Metal builds)
            if [ "${{ matrix.backend }}" == "metal" ]; then
              for shader in ggml-metal.metal ggml-common.h ggml-metal-impl.h; do
                if [ -f "$BUILD_LIB_DIR/$shader" ]; then
                  cp "$BUILD_LIB_DIR/$shader" "release/"
                fi
              done
            fi

            # Copy license files
            find "$BUILD_LIB_DIR" -maxdepth 1 -name "LICENSE-*" -exec cp {} release/ \;

            echo "Packaged libraries:"
            ls -lh release/*.dylib release/*.so 2>/dev/null || echo "No libraries found"

          else
            # Linux: Copy .so files and symlinks
            find "$BUILD_LIB_DIR" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/ \;

            # Also check build/ggml/src for additional libraries
            if [ -d "build/ggml/src" ]; then
              find "build/ggml/src" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/ \;
            fi

            echo "Packaged libraries:"
            ls -lh release/*.so 2>/dev/null || echo "No libraries found"
          fi

          # Create version file
          echo "llama-server" > release/version.txt
          echo "${{ github.ref_name }}" >> release/version.txt
          echo "Backend: ${{ matrix.backend }}" >> release/version.txt
          echo "Platform: ${{ matrix.platform }}-${{ matrix.arch }}" >> release/version.txt
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/version.txt

          # Make executable on Unix
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "release/${{ steps.find_binary.outputs.binary_name }}"
          fi

          echo "Release directory contents:"
          ls -lah release/

      # Create archive
      - name: Create archive
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          # If matrix entry has a version_suffix (e.g. CUDA 12.6 vs 13.0),
          # append it so the multiple Windows-CUDA artifacts don't clobber
          # each other on upload-artifact.
          SUFFIX=""
          if [ -n "${{ matrix.version_suffix }}" ]; then
            SUFFIX="${{ matrix.version_suffix }}"
          fi
          ARCHIVE_NAME="llama-server-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.backend }}${SUFFIX}"

          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a "${ARCHIVE_NAME}.zip" ./release/*
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          else
            tar czf "${ARCHIVE_NAME}.tar.gz" -C release .
            echo "ARCHIVE_FILE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          fi

      # Upload artifacts
      - name: Upload artifact
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7

  # Separate job for CUDA (requires Docker container).
  # Matrix-ized for forward + back compat: CUDA 13 needs driver >=580,
  # CUDA 12 only needs >=525, so we ship both and let the user pick.
  # CMAKE_CUDA_ARCHITECTURES diverges too — CUDA 13 dropped Maxwell/Pascal
  # (52, 61). Keep them in the 12.x build for old-GPU users.
  build-cuda:
    name: Build linux-x86_64-cuda${{ matrix.version_suffix }}
    runs-on: ubuntu-22.04
    container: nvidia/cuda:${{ matrix.cuda_version }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.9.1"
            version_suffix: "12.9"
            cuda_archs: "52;61;70;75;80;86;89;90"
          - cuda_version: "13.2.0"
            version_suffix: "13.2"
            cuda_archs: "75;80;86;89;90;100;120"
    if: |
      (github.event_name == 'push') ||
      ((inputs.platform == 'all' || inputs.platform == 'linux') &&
       (inputs.backend == 'all' || inputs.backend == 'cuda'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git cmake libcurl4-openssl-dev curl

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
          apt-get install -y nodejs

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x86_64-cuda${{ matrix.version_suffix }}
          max-size: 500M

      - name: Build llama-server
        run: |
          mkdir build
          cd build

          # Base CMake configuration with optimization flags
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DGGML_STATIC=OFF -DLLAMA_SERVER_ONLY=ON"

          # Portability and compatibility flags
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_NATIVE=OFF"              # Don't optimize for build machine CPU
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_BACKEND_DL=ON"           # Dynamic backend loading
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_CPU_ALL_VARIANTS=ON"    # Multi-CPU variant support

          # RPATH for automatic library discovery
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_INSTALL_RPATH='\$ORIGIN'"
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"

          # CUDA backend
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_CUDA=ON"
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.cuda_archs }}"

          # Enable ccache
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake .. $CMAKE_ARGS
          cmake --build . --config Release --target llama-server -j$(nproc)

          echo "Build complete"
          ls -lah bin/

      - name: Find binary path
        id: find_binary
        run: |
          BINARY_PATH=$(find build/bin -name "llama-server" -type f | head -n 1)
          if [ -z "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "Found binary at: $BINARY_PATH"

      - name: Prepare release archive
        run: |
          mkdir -p release

          # Copy binary
          cp "${{ steps.find_binary.outputs.binary_path }}" "release/llama-server"

          # Copy shared libraries
          BUILD_LIB_DIR="build/ggml/src"
          if [ -d "$BUILD_LIB_DIR" ]; then
            mkdir -p release/lib
            find "$BUILD_LIB_DIR" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/lib/ \;
            if [ -d "build/bin" ]; then
              find "build/bin" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/lib/ \;
            fi
            echo "Packaged shared libraries:"
            ls -lh release/lib/
          fi

          # Create version file
          echo "llama-server" > release/version.txt
          echo "${{ github.ref_name }}" >> release/version.txt
          echo "Backend: cuda ${{ matrix.version_suffix }}" >> release/version.txt
          echo "Platform: linux-x86_64" >> release/version.txt
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/version.txt

          chmod +x "release/llama-server"

          echo "Release directory contents:"
          ls -lah release/

      - name: Create archive
        run: |
          tar czf "llama-server-linux-x86_64-cuda${{ matrix.version_suffix }}.tar.gz" -C release .
          echo "ARCHIVE_FILE=llama-server-linux-x86_64-cuda${{ matrix.version_suffix }}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64-cuda${{ matrix.version_suffix }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7

  # Separate job for ROCm (requires Docker container).
  # Matrix-ized: ROCm doesn't have minor-version forward-compat
  # (libamdhip64.so.6.x ABI breaks between minors), so shipping two
  # majors is the standard way to cover both AMD's old-stable (5.7,
  # the last 5.x — MI200/MI250 era) and current (6.1 — MI300 era +
  # newer consumer cards). Users pick the artifact matching their
  # rocm-dkms install.
  build-rocm:
    name: Build linux-x86_64-rocm${{ matrix.version_suffix }}
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:${{ matrix.rocm_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rocm_version: "5.7.1"
            version_suffix: "5.7"
          - rocm_version: "6.1.2"
            version_suffix: "6.1"
    if: |
      (github.event_name == 'push') ||
      ((inputs.platform == 'all' || inputs.platform == 'linux') &&
       (inputs.backend == 'all' || inputs.backend == 'rocm'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev rocwmma-dev curl libcurl4-openssl-dev

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x86_64-rocm${{ matrix.version_suffix }}
          max-size: 500M

      - name: Build llama-server
        run: |
          mkdir build
          cd build

          # Base CMake configuration with optimization flags
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DGGML_STATIC=OFF -DLLAMA_SERVER_ONLY=ON"

          # Portability and compatibility flags
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_NATIVE=OFF"              # Don't optimize for build machine CPU
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_BACKEND_DL=ON"           # Dynamic backend loading
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_CPU_ALL_VARIANTS=ON"    # Multi-CPU variant support

          # RPATH for automatic library discovery
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_INSTALL_RPATH='\$ORIGIN'"
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"

          # ROCm backend
          CMAKE_ARGS="$CMAKE_ARGS -DGGML_HIPBLAS=ON"

          # Enable ccache
          export CMAKE_C_COMPILER_LAUNCHER=ccache
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake .. $CMAKE_ARGS
          cmake --build . --config Release --target llama-server -j$(nproc)

          echo "Build complete"
          ls -lah bin/

      - name: Find binary path
        id: find_binary
        run: |
          BINARY_PATH=$(find build/bin -name "llama-server" -type f | head -n 1)
          if [ -z "$BINARY_PATH" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "Found binary at: $BINARY_PATH"

      - name: Prepare release archive
        run: |
          mkdir -p release

          # Copy binary
          cp "${{ steps.find_binary.outputs.binary_path }}" "release/llama-server"

          # Copy shared libraries
          BUILD_LIB_DIR="build/ggml/src"
          if [ -d "$BUILD_LIB_DIR" ]; then
            mkdir -p release/lib
            find "$BUILD_LIB_DIR" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/lib/ \;
            if [ -d "build/bin" ]; then
              find "build/bin" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -exec cp -P {} release/lib/ \;
            fi
            echo "Packaged shared libraries:"
            ls -lh release/lib/
          fi

          # Create version file
          echo "llama-server" > release/version.txt
          echo "${{ github.ref_name }}" >> release/version.txt
          echo "Backend: rocm ${{ matrix.version_suffix }}" >> release/version.txt
          echo "Platform: linux-x86_64" >> release/version.txt
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/version.txt

          chmod +x "release/llama-server"

          echo "Release directory contents:"
          ls -lah release/

      - name: Create archive
        run: |
          tar czf "llama-server-linux-x86_64-rocm${{ matrix.version_suffix }}.tar.gz" -C release .
          echo "ARCHIVE_FILE=llama-server-linux-x86_64-rocm${{ matrix.version_suffix }}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-linux-x86_64-rocm${{ matrix.version_suffix }}
          path: ${{ env.ARCHIVE_FILE }}
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-matrix, build-cuda, build-rocm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## llama-server Release ${{ github.ref_name }}

            Based on llama.cpp version: `${{ github.ref_name }}`

            ### Supported Platforms and Backends

            - **Linux x86_64**: CPU, CUDA 12.9, CUDA 13.2, ROCm 5.7, ROCm 6.1
            - **macOS aarch64**: Metal
            - **Windows x86_64**: CPU, CUDA 12.4, CUDA 13.3

            ### Pick the right GPU artifact

            | Backend | Artifact suffix | Driver / runtime requirement |
            | --- | --- | --- |
            | NVIDIA 13.x | Linux `-cuda13.2`, Windows `-cuda13.3` | Driver ≥ 580 (Linux) / ≥ 581 (Windows), CUDA runtime 13.x. Supports Turing → Blackwell (`sm_75`–`sm_120`). |
            | NVIDIA 12.x | Linux `-cuda12.9`, Windows `-cuda12.4` | Driver ≥ 525 (12.4 Windows) / ≥ 575 (12.9 Linux), CUDA runtime 12.x. Adds Maxwell + Pascal (`sm_52`, `sm_61`) for older cards. |

            *Note*: Linux + Windows pin to different CUDA patch versions because the two installers track different version catalogs. Both 12.x binaries are mutually-runnable with any 12.x driver runtime (`libcudart.so.12` SONAME), as long as the driver is ≥ the version listed.
            | AMD, current | `-rocm6.1` | rocm-dkms 6.x. MI300, Navi3, modern consumer / datacenter. |
            | AMD, legacy | `-rocm5.7` | rocm-dkms 5.7.x. MI200/MI250 era, Navi2 boxes still on 5.x. |

            ### Installation

            1. Download the appropriate archive for your platform and GPU backend
            2. Extract the archive
            3. The `llama-server` binary is ready to use:
               ```bash
               ./llama-server --help
               ```

            **Note**: GPU builds include shared libraries in the `lib/` directory. These are automatically discovered via RPATH - no need to set `LD_LIBRARY_PATH`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
